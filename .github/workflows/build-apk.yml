name: Build ORBIT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch 3D map project
        run: |
          git clone --depth 1 --branch master https://github.com/ming-0107-l/delta-force-3d-map.git delta-map
          cp -r delta-map/app .
          cp delta-map/build.gradle .
          cp delta-map/settings.gradle .
          cp delta-map/gradle.properties . 2>/dev/null || true

          # Give the app its own package and label.
          sed -i 's/com.deltamap.app/com.orbit.radar/g' app/build.gradle
          sed -i 's/package com.deltamap.app;/package com.orbit.radar;/' app/src/main/java/com/deltamap/app/MainActivity.java
          sed -i 's/label="三角洲地图"/label="ORBIT 无卡密雷达"/' app/src/main/AndroidManifest.xml

          # Mobile WebView can expose a relatively small CSS viewport. Render the
          # canvas at a higher physical pixel ratio so the map is not upscaled blurry.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2.5));
          if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;",
              "const mobileDpr = matchMedia('(pointer: coarse)').matches ? 2.5 : (devicePixelRatio || 1);\nrenderer.setPixelRatio(Math.min(mobileDpr, 2.5));"
          )
          s = s.replace(
              "low:  { pr: 0.7,  label: '流畅' },\n  mid:  { pr: 1.0,  label: '标准' },\n  high: { pr: 1.5,  label: '高清' },",
              "low:  { pr: 0.70, label: '流畅' },\n  mid:  { pr: 1.00, label: '标准' },\n  high: { pr: 1.25, label: '高清' },"
          )
          s = s.replace(
              "const pr = Math.min(QUALITY[q].pr, devicePixelRatio || 1);",
              "const baseDpr = matchMedia('(pointer: coarse)').matches ? Math.max(devicePixelRatio || 1, 2.5) : (devicePixelRatio || 1);\n  const pr = Math.min(baseDpr * QUALITY[q].pr, 3.0);"
          )
          s = s.replace(
              "renderer.setPixelRatio(Math.min(QUALITY[quality].pr, devicePixelRatio || 1));",
              "const baseDpr = matchMedia('(pointer: coarse)').matches ? Math.max(devicePixelRatio || 1, 2.5) : (devicePixelRatio || 1);\n  renderer.setPixelRatio(Math.min(baseDpr * QUALITY[quality].pr, 3.0));"
          )
          s = s.replace(
              '<div class="chip" id="c-stat">就绪</div>',
              '<div class="modebar"><button id="mode-2d" class="on">2D</button><button id="mode-3d">3D</button></div><div class="chip" id="c-stat">就绪</div>'
          )
          s = s.replace(
              '  .chip b{color:var(--fg)}',
              '  .chip b{color:var(--fg)} .modebar{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#111722} .modebar button{border:0;border-radius:0;padding:4px 12px;background:transparent;color:var(--sub);font-size:12px} .modebar button.on{background:rgba(63,169,255,.22);color:#dff2ff}'
          )
          s = s.replace(
              'const canvas = renderer.domElement;',
              'let map2D=true; const mode2d=document.getElementById("mode-2d"); const mode3d=document.getElementById("mode-3d"); function applyViewMode(){map2D=true;if(mode2d)mode2d.classList.add("on");if(mode3d)mode3d.classList.remove("on");if(!state.world)return;const b=new THREE.Box3();if(buildGrp)b.expandByObject(buildGrp);if(termGrp&&termGrp.visible)b.expandByObject(termGrp);if(b.isEmpty())return;const c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3()),r=Math.max(sz.x,sz.z)*0.5,d=r/Math.tan(Math.PI*camera.fov/360)*1.18;camera.position.set(c.x,c.y+d,c.z);camera.rotation.set(-Math.PI/2,0,0);camera.updateProjectionMatrix();} function set3D(){map2D=false;if(mode2d)mode2d.classList.remove("on");if(mode3d)mode3d.classList.add("on");fit();} if(mode2d)mode2d.onclick=applyViewMode;if(mode3d)mode3d.onclick=set3D; const canvas=renderer.domElement;'
          )
          s = s.replace(
              '    fit(); setTimeout(applyViewMode,0); startTest(el(\'s-test\').classList.contains(\'on\'));',
              '    fit();\\n    setTimeout(applyViewMode, 0);\\n    startTest(el(\'s-test\').classList.contains(\'on\'));'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
